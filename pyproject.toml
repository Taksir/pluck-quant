[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pluck-quant"
version = "1.0.1"
description = "PLUCK: gene-level expression from exact counts of fixed 25-mer probes (Collaborative Cross / Diversity Outbred mice)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "MD TAKSIR HASAN MAJUMDER" }]
dependencies = ["numpy>=2.0", "pandas>=2.2", "numba>=0.60"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.optional-dependencies]
msbwt = ["pymsbwt>=0.5; python_version >= '3.14'"]
extended = ["scipy>=1.13"]
dev = ["pytest"]

[project.scripts]
pluck = "pluck_quant.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pluck_quant = ["native/*.c", "_design/*", "_data/*"]
